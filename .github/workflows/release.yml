name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitHub release with script + checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x kube-lint-pretty
          sha256sum kube-lint-pretty > kube-lint-pretty.sha256
          gh release create "$GITHUB_REF_NAME" kube-lint-pretty kube-lint-pretty.sha256 --generate-notes
