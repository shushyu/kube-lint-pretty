name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KUBE_LINTER_VERSION: "0.8.3"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck kube-lint-pretty test/run.sh
      - name: install kube-linter
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)   a=kube-linter-linux ;;
            Linux-aarch64)  a=kube-linter-linux_arm64 ;;
            Darwin-arm64)   a=kube-linter-darwin_arm64 ;;
            Darwin-x86_64)  a=kube-linter-darwin ;;
          esac
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/${a}.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kube-linter
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: tests (system bash)
        run: /bin/bash test/run.sh
