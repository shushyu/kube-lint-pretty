apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-nginx
  namespace: default
spec:
  selector:
    matchLabels: {app: insecure-nginx}
  template:
    metadata:
      labels: {app: insecure-nginx}
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: nginx
        image: nginx:latest
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
          capabilities:
            add: ["NET_RAW"]
